name = "ijisho-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Personal Cloudflare account (theoneste2060@gmail.com), not the hdev.rw one.
account_id = "dfb429dd535404a52dd0087e00096b71"

[vars]
# Browsers only need CORS for local development; in production the app calls the API through a same-origin Vercel rewrite.
ALLOWED_ORIGINS = "http://localhost:4190"

[[d1_databases]]
binding = "DB"
database_name = "ijisho"
database_id = "4e63266e-4768-4637-b2e9-f9d1ecd5a56f"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]  # daily: delete escalation photos older than 30 days

# Secret (set with `npx wrangler secret put ADMIN_TOKEN`, never committed):
#   ADMIN_TOKEN  the password for the admin page, at least 12 characters
